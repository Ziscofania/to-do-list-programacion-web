<!doctype html>
<html lang="es" data-bs-theme="auto">
<head>
  <meta charset="utf-8" />
  <title>Mini To-Do — TypeScript → Cards + Bootstrap</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Bootstrap 5 CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
    crossorigin="anonymous"
  >
  <!-- Bootstrap Icons -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
    rel="stylesheet"
  >
  <!-- Tu hoja de estilos -->
  <link rel="stylesheet" href="stylesheet.css">
</head>
<body>
  <div class="container py-4">
    <!-- Barra superior -->
    <div class="d-flex align-items-center justify-content-between gap-2 mb-3">
      <h1 class="h4 m-0">
        <i class="bi bi-check2-circle text-primary me-2"></i>Mini To-Do
        <small class="text-secondary fw-normal">TypeScript sin frameworks</small>
      </h1>
      <div class="d-flex gap-2">
        <a href="index.html" target="_blank" rel="noopener" class="btn btn-outline-secondary btn-sm">
          <i class="bi bi-box-arrow-up-right me-1"></i> Abrir en pestaña nueva
        </a>
        <button id="open-new" class="btn btn-primary btn-sm">
          <i class="bi bi-window-plus me-1"></i> Duplicar vista
        </button>
      </div>
    </div>

    <!-- Card principal de acciones -->
    <div class="card shadow-sm border-0 mb-3">
      <div class="card-body p-3 p-lg-4">
        <!-- Input + Agregar -->
        <div class="input-group mb-3">
          <span class="input-group-text bg-transparent border-end-0"><i class="bi bi-pencil"></i></span>
          <input id="task-input" type="text" class="form-control border-start-0" placeholder="Escribe una tarea…" autocomplete="off"/>
          <button id="add-btn" class="btn btn-primary">
            <i class="bi bi-plus-circle me-1"></i>Agregar
          </button>
        </div>

        <!-- Filtros + contador + limpiar -->
        <div class="d-flex flex-wrap align-items-center gap-2">
          <div class="btn-group" role="group" aria-label="Filtros">
            <button data-filter="all" class="btn btn-outline-secondary">Todas</button>
            <button data-filter="active" class="btn btn-outline-secondary">Activas</button>
            <button data-filter="done" class="btn btn-outline-secondary">Completadas</button>
          </div>

          <!-- Filtro de categorías -->
          <select id="category-filter" class="form-select form-select-sm" style="width:auto;">
            <option value="all">Todas las categorías</option>
            <option value="__new__">➕ Nueva categoría…</option>
          </select>

          <div class="ms-auto d-flex align-items-center gap-2">
            <span id="counter" class="badge rounded-pill text-bg-light px-3 py-2">0 tareas</span>
            <button id="clear-done" class="btn btn-outline-danger btn-sm">
              <i class="bi bi-trash3 me-1"></i>Eliminar completadas
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Cards de estadísticas -->
    <div class="row g-3 mb-3" id="stats-row">
      <div class="col-12 col-md-4">
        <div class="card h-100 shadow-sm">
          <div class="card-body d-flex align-items-center justify-content-between">
            <div>
              <div class="text-secondary small">Activas</div>
              <div id="stat-active" class="h4 m-0">0</div>
            </div>
            <i class="bi bi-lightning-charge text-warning fs-4"></i>
          </div>
        </div>
      </div>
      <div class="col-12 col-md-4">
        <div class="card h-100 shadow-sm">
          <div class="card-body d-flex align-items-center justify-content-between">
            <div>
              <div class="text-secondary small">Completadas</div>
              <div id="stat-done" class="h4 m-0">0</div>
            </div>
            <i class="bi bi-check2-circle text-success fs-4"></i>
          </div>
        </div>
      </div>
      <div class="col-12 col-md-4">
        <div class="card h-100 shadow-sm">
          <div class="card-body d-flex align-items-center justify-content-between">
            <div>
              <div class="text-secondary small">Total</div>
              <div id="stat-total" class="h4 m-0">0</div>
            </div>
            <i class="bi bi-collection fs-4 text-primary"></i>
          </div>
        </div>
      </div>
    </div>

    <!-- GRID de cards de tareas -->
    <div id="list" class="row row-cols-1 row-cols-md-2 row-cols-xl-3 g-3"></div>

    <!-- Estado vacío -->
    <div id="empty" class="text-secondary text-center py-5 d-none">
      <i class="bi bi-emoji-neutral fs-3 d-block mb-2"></i>
      No hay tareas todavía.
    </div>
  </div>

  <!-- Modal nueva categoría -->
  <div class="modal fade" id="newCategoryModal" tabindex="-1" aria-labelledby="newCategoryLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content shadow-sm border-0">
        <div class="modal-header">
          <h5 class="modal-title" id="newCategoryLabel"><i class="bi bi-folder-plus me-2"></i>Nueva categoría</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <input type="text" id="new-category-input" class="form-control" placeholder="Escribe el nombre de la categoría">
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" id="save-category-btn" class="btn btn-primary">Guardar</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap 5 JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
  <!-- Tu TypeScript -->
  <script type="text/babel" data-presets="typescript" src="main.ts"></script>
</body>
</html>
